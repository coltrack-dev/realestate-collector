services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: realestate
      POSTGRES_USER: collector
      POSTGRES_PASSWORD: collector
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collector -d realestate"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
